{% extends 'main/base.html' %}

{% block title %}SMX{% endblock title%}

{% block content %}

{% load static %}

<div class="container-fluid">
    <!--logo smx-->
    <div class="row">
        {% include "main/navbar_2.html" %}
    </div>
</div>

<div class="container ">
    <div class="row">
        <div class="col-12 my-auto  bg-gray bg-opacity-50 py-3 pe-3 rounded-3">

                <h1 class="display-4">{{ current_event.title }}</h1>  

        </div>
    </div>
</div>

<div class="container-fluid mb-3 p-0">

    <div class="row mt-5">
        <div id="carouselExampleInterval" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">
                
                {% for photo in event_photos %}
        
                <div class="carousel-item active" data-bs-interval="15000">
                    <img src="{{ photo.photo.url }}" class="d-block w-100 imagebanner" alt="...">
                </div>
                
                {% endfor %}
                
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleInterval" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleInterval" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
            </div>
    </div>
</div>


<div class="container ">
    <div class="row">
        <div class="col-12 my-auto  bg-gray bg-opacity-50 py-3 pe-3 rounded-3">

                <p class="lead">{{ current_event.description }}</p>    

        </div>
    </div>
</div>


    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>

{% endblock content %}
