{% extends 'main/base.html' %}

{% block title %}SMX{% endblock title%}

{% block content %}

{% load static %}


<div class="container-fluid">
    <!--logo smx-->
    <div class="row">
      {% include "main/navbar_2.html" %}
    </div>
  
</div>
  
<div class="container-fluid mt-5">
    <div class="row"
    style="background-image: url('{{ bg_program.image.url }}');
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            height: 15vh;">
        <div class="col d-flex">
            <h1 class="text-center my-auto mx-auto">school program</h1>
        </div>
    </div>
</div>

<div class="container">
    <div class="row mt-5 border rounded-3">
        <div class="col-12 p-4">
            <h2 class="text-center">{{program.title}}</h2>
            <p class="mt-3">{{program.description}}


            </p>
            <div class="row mt-5 ">
                <div id="carouselExampleInterval" class="carousel slide " data-bs-ride="carousel">
                    <div class="carousel-inner rounded-4">
                      
                      {% for photo in program_photos %}
                        
                      <div class="carousel-item active " data-bs-interval="15000">
                        <img src="{{photo.photo.url}}" class="d-block w-100" alt="...">
                      </div>
                      
                      {% endfor %}
                        
                    </div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleInterval" data-bs-slide="prev">
                      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                      <span class="visually-hidden">Previous</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleInterval" data-bs-slide="next">
                      <span class="carousel-control-next-icon" aria-hidden="true"></span>
                      <span class="visually-hidden">Next</span>
                    </button>
                  </div>
            </div>
        </div>
    </div>
</div>

<hr>
</div>
{% endblock content %}
