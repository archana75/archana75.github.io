{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{% endblock title %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!--nama font-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">

  <style>
    body{
      font-family: Merriweather;
    }
    p{
      font-family:'Merriweather' ;
    }
    .card-img-top {
    width: 100%;
    height: 15vw;
    object-fit: cover;
    }
  
    .imagebanner{
            width: 100%;
            height: 70vh;
            object-fit: cover;
            object-position: center;

        }
  
  </style>
  <script src="https://kit.fontawesome.com/52321facb0.js" crossorigin="anonymous"></script>
</head>
<body>

    {% block content %}{% endblock content %}
    
    <div class="container-fluid bg-body-tertiary">
      <footer class="container pt-3">
          <div class="row">
              <div class="col-12 col-lg-4 text-center mb-3 align-self-center">
                  <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3963.567774356722!2d106.82170957591792!3d-6.5761035642867665!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x2e69c7b53f042fe3%3A0xedd50d0ef554596d!2sSMX%20School%20of%20Maker!5e0!3m2!1sid!2sid!4v1711016355542!5m2!1sid!2sid" width="100%" height="250" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
              </div>
              <div class="col-12 col-lg-4 text-center mb-3 align-self-center">
                  <h3>About us</h3>
                  <p>
                    Website ini dibuat untuk menunjukan berbagai project dari murid SMX.
                    Dibuat oleh Project ARCHANA atas dasar keinginan
                  </p>
              </div>
              <div class="col-12 col-lg-4 text-center mb-3 align-self-center">
                  <img class="img-fluid mx-auto" src="{% static 'main/img/archana_logo.png' %}">
              </div>
          </div>
      </footer>
  </div>    
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.min.js" integrity="sha384-Rx+T1VzGupg4BHQYs2gCW9It+akI2MM/mndMCy36UVfodzcJcF0GGLxZIzObiEfa" crossorigin="anonymous"></script>
</body>
</html>
